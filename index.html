<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2E4A5E" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1813" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Secretary" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Secretary</title>
    <script>
      // Restores the real path from 404.html's redirect (see public/404.html)
      // before React mounts and src/useRoute.js reads window.location.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect === null) return;
        params.delete("redirect");
        var qs = params.toString();
        history.replaceState(null, "", "/plan-tracker/" + redirect + (qs ? "?" + qs : "") + location.hash);
      })();
    </script>
    <script>
      // Applies a stored explicit light/dark choice before first paint (see
      // src/useTheme.js) so switching pages never flashes the wrong theme.
      // No stored choice at all just leaves this alone -- the CSS itself
      // follows prefers-color-scheme with no attribute needed.
      (function () {
        try {
          var stored = localStorage.getItem("secretary-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
